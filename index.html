<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colorful Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Title -->
        <div class="calculator-title">
            ✨ CALCULATOR
        </div>

        <!-- History Button -->
        <button
            id="historyBtn"
            class="history-btn"
            type="button">
            🕘 View History
        </button>


        <!-- Display -->
        <div class="display">

            <div
                id="previous"
                class="previous">
            </div>

            <div
                id="current"
                class="current"
                aria-live="polite">
                0
            </div>

        </div>


        <!-- Calculator Buttons -->
        <div class="buttons">

            <!-- Row 1 -->
            <button
                class="clear"
                type="button"
                data-action="clear">
                AC
            </button>

            <button
                class="delete"
                type="button"
                data-action="delete">
                DEL
            </button>

            <button
                class="operator"
                type="button"
                data-operator="%">
                %
            </button>

            <button
                class="operator"
                type="button"
                data-operator="/">
                ÷
            </button>


            <!-- Row 2 -->
            <button
                type="button"
                data-number="7">
                7
            </button>

            <button
                type="button"
                data-number="8">
                8
            </button>

            <button
                type="button"
                data-number="9">
                9
            </button>

            <button
                class="operator"
                type="button"
                data-operator="*">
                ×
            </button>


            <!-- Row 3 -->
            <button
                type="button"
                data-number="4">
                4
            </button>

            <button
                type="button"
                data-number="5">
                5
            </button>

            <button
                type="button"
                data-number="6">
                6
            </button>

            <button
                class="operator"
                type="button"
                data-operator="-">
                −
            </button>


            <!-- Row 4 -->
            <button
                type="button"
                data-number="1">
                1
            </button>

            <button
                type="button"
                data-number="2">
                2
            </button>

            <button
                type="button"
                data-number="3">
                3
            </button>

            <button
                class="operator"
                type="button"
                data-operator="+">
                +
            </button>


            <!-- Row 5 -->
            <button
                class="zero"
                type="button"
                data-number="0">
                0
            </button>

            <button
                class="decimal"
                type="button"
                data-action="decimal">
                .
            </button>

            <button
                class="equals"
                type="button"
                data-action="equals">
                =
            </button>

        </div>


        <!-- History Panel -->
        <div
            id="historyPanel"
            class="history-panel">

            <div class="history-header">

                <h3>
                    Calculation History
                </h3>

                <button
                    id="closeHistory"
                    class="close-history"
                    type="button">
                    ×
                </button>

            </div>


            <div
                id="historyList"
                class="history-list">

                <p class="empty-history">
                    No calculations yet
                </p>

            </div>


            <button
                id="clearHistory"
                class="clear-history"
                type="button">

                🗑 Clear History

            </button>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
